name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: strategy_redteam
          POSTGRES_USER: strategy_redteam
          POSTGRES_PASSWORD: strategy_redteam
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U strategy_redteam -d strategy_redteam"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://strategy_redteam:strategy_redteam@localhost:5432/strategy_redteam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --extra hosted
      - run: uv run alembic upgrade head
      - run: uv run pytest -q -m 'not hosted and not postgres'
      - run: uv run pytest -q -m postgres
      - run: uv run ruff check .
      - run: uv run mypy src
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 11.24.0}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm build
