[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strategy-redteam"
version = "0.1.0"
description = "Typed contracts for a deterministic trading-strategy red-team lab"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=16.1",
    "PyYAML>=6.0.2",
    "pydantic>=2.7",
    "typer>=0.12",
    "yfinance>=0.2.40",
    "ollama>=0.4",
]

[project.scripts]
strategy-redteam = "strategy_redteam.cli:app"
redteam = "strategy_redteam.cli:app"

[project.optional-dependencies]
hosted = [
    "agent-framework-core==1.13.0",
    "agent-framework-foundry==1.10.4",
    "azure-ai-agentserver-invocations==1.0.0",
    "azure-identity==1.25.3",
    "azure-storage-blob==12.30.0",
]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
strategy_redteam = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=strategy_redteam --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["strategy_redteam"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
